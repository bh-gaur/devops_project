apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-cosign-image-signature
  annotations:
    policies.kyverno.io/title: Verify Cosign Image Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforces image verification using Cosign keyless signatures via GitHub OIDC identity.
      Pods with unsigned images or invalid signatures are rejected at admission.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/bh-gaur/devops_project:*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/vishnu/devops_project/*"
