apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/bh-gaur/devops_project.git"
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
