apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
  namespace: default
  labels:
    app: devops-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: devops-app
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-canary-service
  namespace: default
  labels:
    app: devops-app
    tier: canary
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: devops-app
